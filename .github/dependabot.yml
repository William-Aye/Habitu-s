# One monthly round, at most two pull requests per area: minor and patch updates together,
# major updates together. Security updates are separate and still arrive as soon as needed.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      npm-root-minor-patch:
        update-types: ["minor", "patch"]
      npm-root-major:
        update-types: ["major"]

  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "monthly"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    # The Expo SDK pins these; update them with `npx expo install --fix` when moving SDK, not one by one
    # (CI's "Expo SDK versions" step fails on a mismatch). Security updates still arrive.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "jest-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@react-native-community/*"
      # Native modules the SDK does not pin: CI cannot build them natively, so majors wait for a manual
      # upgrade with a device build.
      - dependency-name: "@react-native-google-signin/google-signin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@maplibre/maplibre-react-native"
        update-types: ["version-update:semver-major"]
    groups:
      npm-app-minor-patch:
        update-types: ["minor", "patch"]
      npm-app-major:
        update-types: ["major"]

  # The importer is locked with uv (importer/uv.lock), so use the uv ecosystem.
  - package-ecosystem: "uv"
    directory: "/importer"
    schedule:
      interval: "monthly"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      uv-minor-patch:
        update-types: ["minor", "patch"]
      uv-major:
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
      actions-major:
        update-types: ["major"]
