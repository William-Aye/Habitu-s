name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    name: Database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start

      - name: Run pgTAP database tests
        run: npx supabase test db

      - name: Security advisor (allowlist)
        run: |
          npx supabase db advisors --local --type security --level warn --output-format json > advisors.json
          node scripts/check-advisors.mjs advisors.json supabase/advisors-allowlist.json

  app:
    name: App (Jest, lint, typecheck)
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Test
        working-directory: app
        run: npm test

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit

  importer:
    name: Importer (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Sync and run unit tests
        run: cd importer && uv sync && uv run pytest

  ranking:
    name: Search ranking (pytest, local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start

      - uses: astral-sh/setup-uv@v5

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: e5-small-v1

      - name: Run the ranking tests
        env:
          RANKING_REPORT: '1'
        run: cd importer && uv sync && uv run pytest -m ranking -s

  web:
    name: Web
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: http://127.0.0.1:55321
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix app

      - name: Test
        run: npm run web:test

      - name: Build
        run: npm run web:build

  functions:
    name: Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Edge Function tests (Deno)
        run: npx --yes deno@2 test supabase/functions

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v5

      - name: npm audit (root)
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-root.json" || true
          node scripts/check-npm-audit.mjs "$RUNNER_TEMP/audit-root.json" audit-allowlist.json

      - name: npm audit (app)
        working-directory: app
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-app.json" || true
          node ../scripts/check-npm-audit.mjs "$RUNNER_TEMP/audit-app.json" ../audit-allowlist.json

      - name: pip-audit (importer)
        working-directory: importer
        run: |
          uv export --no-dev --no-hashes --frozen --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Script tests
        run: npm run scripts:test
