name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start

      - name: Run pgTAP database tests
        run: npx supabase test db

  app:
    name: App (Jest, lint, typecheck)
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Test
        working-directory: app
        run: npm test

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit

  importer:
    name: Importer (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Sync and run unit tests
        run: cd importer && uv sync && uv run pytest

  edge:
    name: Edge function (deno test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run embed-query tests
        run: deno test supabase/functions/embed-query

  ranking:
    name: Search ranking (pytest, local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start

      - uses: astral-sh/setup-uv@v5

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: e5-small-v1

      - name: Run the ranking tests
        env:
          RANKING_REPORT: '1'
        run: cd importer && uv sync && uv run pytest -m ranking -s

      # Production embeds queries in the Edge Function (Transformers.js, q8); the ranking rule was
      # tuned on Python fp32 query embeddings. Serve the function and check that they agree.
      - name: Serve embed-query
        run: |
          nohup npx supabase functions serve embed-query > "$RUNNER_TEMP/functions.log" 2>&1 &
          eval "$(npx supabase status -o env)"
          test -n "$ANON_KEY"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Wait for embed-query (the first call downloads the model)
        timeout-minutes: 20
        run: |
          log="$RUNNER_TEMP/functions.log"
          shown=0
          deadline=$((SECONDS + 900))
          i=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            i=$((i + 1))
            start=$SECONDS
            # The first call may download the weights (~118 MB), hence the long per-call limit.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 -X POST \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
              -d '{"text":"test"}' http://127.0.0.1:55321/functions/v1/embed-query || true)
            echo "attempt $i: HTTP ${code:-none} after $((SECONDS - start)) s (total ${SECONDS} s)"
            total=$(wc -l < "$log" 2>/dev/null || echo 0)
            if [ "$total" -gt "$shown" ]; then
              echo "--- functions.log (new lines, last 20) ---"
              tail -n +"$((shown + 1))" "$log" | tail -n 20
              shown=$total
            fi
            if [ "$code" = 200 ]; then exit 0; fi
            sleep 5
          done
          echo "embed-query not ready after 15 minutes"
          exit 1

      - name: Embedding parity (Edge vs Python)
        run: cd importer && uv run pytest -m edge tests/ranking/test_embed_parity.py

      # Informational until the rule is checked on q8 query embeddings: the step's own result
      # shows whether the ranking set also holds on the production query path.
      - name: Ranking set with Edge query embeddings (informational)
        continue-on-error: true
        env:
          RANKING_QUERY_EMBEDDER: edge
        run: cd importer && uv run pytest -m ranking

      - name: Edge function log
        if: always()
        run: tail -n 300 "$RUNNER_TEMP/functions.log" 2>/dev/null || echo "no functions.log"
