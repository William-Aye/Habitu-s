name: Query vocabulary

on:
  schedule:
    - cron: '17 2 * * *' # every night, 02:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: 'Full build (all associations) instead of user requests only'
        type: boolean
        default: false

# Shares the group with import.yml: never runs alongside an import.
concurrency: import

permissions:
  contents: read

jobs:
  vocab:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full && 120 || 30 }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: e5-small-v1

      - name: Build vocabulary
        env:
          IMPORTER_DB_URL: ${{ secrets.IMPORTER_DB_URL }}
          # Passed through the environment, never interpolated into the script.
          FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          args=(--db-url "$IMPORTER_DB_URL")
          if [ "${FULL:-false}" != "true" ]; then
            args+=(--requests-only)
          fi
          uv run --project importer python -m importer vocab "${args[@]}"
