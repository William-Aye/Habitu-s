name: Query vocabulary

on:
  schedule:
    - cron: '17 2 * * *' # every night, 02:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: 'Full build (all associations) instead of user requests only'
        type: boolean
        default: false

# Shares the group with import.yml: never runs alongside an import.
concurrency: import

permissions:
  contents: read

jobs:
  # Until the hosted database exists, the nightly run is skipped instead of failing every night.
  # A manual run without the secret still fails, with a clear message.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.secret.outputs.configured }}
    steps:
      - id: secret
        env:
          IMPORTER_DB_URL: ${{ secrets.IMPORTER_DB_URL }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "${IMPORTER_DB_URL:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "schedule" ]; then
            echo "::notice::IMPORTER_DB_URL is not set: nightly vocabulary skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::IMPORTER_DB_URL is not set. Add it in Settings, Secrets and variables, Actions."
            exit 1
          fi

  vocab:
    needs: check
    if: ${{ needs.check.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full && 180 || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Cache embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: e5-small-v1

      - name: Build vocabulary
        env:
          IMPORTER_DB_URL: ${{ secrets.IMPORTER_DB_URL }}
          # Passed through the environment, never interpolated into the script.
          FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          args=(--db-url "$IMPORTER_DB_URL")
          if [ "${FULL:-false}" != "true" ]; then
            args+=(--requests-only)
          fi
          uv run --project importer python -m importer vocab "${args[@]}"

      # New activities and collectifs are searchable by keywords at once; their meaning vector is
      # computed here, so they are found by meaning from the next morning.
      - name: Embed new activities and collectifs
        if: ${{ !cancelled() }}
        env:
          IMPORTER_DB_URL: ${{ secrets.IMPORTER_DB_URL }}
        run: uv run --project importer python -m importer embed-activities --db-url "$IMPORTER_DB_URL"
