name: Query vocabulary

on:
  schedule:
    - cron: '17 2 * * *' # every night, 02:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: 'Full build (all associations) instead of user requests only'
        type: boolean
        default: false

# Shares the group with import.yml: never runs alongside an import.
concurrency: import

permissions:
  contents: read

jobs:
  vocab:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full && 180 || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Cache embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: e5-small-v1

      - name: Build vocabulary
        env:
          IMPORTER_DB_URL: ${{ secrets.IMPORTER_DB_URL }}
          # Passed through the environment, never interpolated into the script.
          FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          args=(--db-url "$IMPORTER_DB_URL")
          if [ "${FULL:-false}" != "true" ]; then
            args+=(--requests-only)
          fi
          uv run --project importer python -m importer vocab "${args[@]}"

      # New activities and collectifs are searchable by keywords at once; their meaning vector is
      # computed here, so they are found by meaning from the next morning.
      - name: Embed new activities and collectifs
        if: ${{ !cancelled() }}
        env:
          IMPORTER_DB_URL: ${{ secrets.IMPORTER_DB_URL }}
        run: uv run --project importer python -m importer embed-activities --db-url "$IMPORTER_DB_URL"
