name: Association import

on:
  schedule:
    - cron: '0 3 5 * *' # 5th of each month, 03:00 UTC
  workflow_dispatch:
    inputs:
      departements:
        description: 'Comma-separated departement codes (empty = all France)'
        type: string
        default: ''

concurrency: import

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: e5-small-v1

      - name: Download France OSM extract
        run: curl -fsSL -o france-latest.osm.pbf https://download.geofabrik.de/europe/france-latest.osm.pbf

      - name: Filter and export OSM clubs
        run: |
          osmium tags-filter france-latest.osm.pbf nwr/club nwr/leisure=sports_centre,sports_hall,dance,fitness_centre nwr/amenity=community_centre,social_centre,arts_centre -o filtered.osm.pbf
          osmium export filtered.osm.pbf -f geojsonseq -a type,id -o clubs.geojsonseq

      - name: Run import
        env:
          IMPORTER_DB_URL: ${{ secrets.IMPORTER_DB_URL }}
          # Passed through the environment, never interpolated into the script.
          DEPARTEMENTS: ${{ inputs.departements }}
        run: |
          set -euo pipefail
          deps="$(printf '%s' "${DEPARTEMENTS:-}" | tr -d '[:space:]')"
          args=(--osm-geojsonseq clubs.geojsonseq)
          if [ -n "$deps" ]; then
            args+=(--departements "$deps")
          fi
          uv run --project importer python -m importer run "${args[@]}"
