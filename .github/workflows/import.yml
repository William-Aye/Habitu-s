name: Association import

on:
  schedule:
    - cron: '0 3 5 * *' # 5th of each month, 03:00 UTC
  workflow_dispatch:
    inputs:
      departements:
        description: 'Comma-separated departement codes (empty = all France)'
        type: string
        default: ''

concurrency: import

permissions:
  contents: read

jobs:
  # Until the hosted database exists, the monthly run is skipped instead of failing.
  # A manual run without the secret still fails, with a clear message.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.secret.outputs.configured }}
    steps:
      - id: secret
        env:
          IMPORTER_DB_URL: ${{ secrets.IMPORTER_DB_URL }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "${IMPORTER_DB_URL:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "schedule" ]; then
            echo "::notice::IMPORTER_DB_URL is not set: monthly import skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::IMPORTER_DB_URL is not set. Add it in Settings, Secrets and variables, Actions."
            exit 1
          fi

  import:
    needs: check
    if: ${{ needs.check.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Cache embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: e5-small-v1

      - name: Download France OSM extract
        run: curl -fsSL -o france-latest.osm.pbf https://download.geofabrik.de/europe/france-latest.osm.pbf

      - name: Filter and export OSM clubs
        run: |
          osmium tags-filter france-latest.osm.pbf nwr/club nwr/leisure=sports_centre,sports_hall,dance,fitness_centre nwr/amenity=community_centre,social_centre,arts_centre -o filtered.osm.pbf
          osmium export filtered.osm.pbf -f geojsonseq -a type,id -o clubs.geojsonseq

      - name: Run import
        env:
          IMPORTER_DB_URL: ${{ secrets.IMPORTER_DB_URL }}
          # Passed through the environment, never interpolated into the script.
          DEPARTEMENTS: ${{ inputs.departements }}
        run: |
          set -euo pipefail
          deps="$(printf '%s' "${DEPARTEMENTS:-}" | tr -d '[:space:]')"
          args=(--osm-geojsonseq clubs.geojsonseq)
          if [ -n "$deps" ]; then
            args+=(--departements "$deps")
          fi
          uv run --project importer python -m importer run "${args[@]}"

  vocab:
    needs: import
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Cache embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: e5-small-v1

      - name: Build query vocabulary
        env:
          IMPORTER_DB_URL: ${{ secrets.IMPORTER_DB_URL }}
        run: uv run --project importer python -m importer vocab --db-url "$IMPORTER_DB_URL"
