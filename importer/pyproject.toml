[project]
name = "importer"
version = "0.1.0"
description = "Monthly association directory import (RNA, OSM, geocoding, tagging, embeddings)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.3.6",
    "sentence-transformers>=3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["importer"]

[tool.pytest.ini_options]
markers = [
    "integration: needs local Supabase",
    "slow: downloads the embedding model",
    "ranking: search ranking test set; needs local Supabase and the e5 model",
    "perf: large-city timing check; local only",
]
addopts = "-m \"not integration and not slow and not ranking and not perf\""
testpaths = ["tests"]
